x-app: &app
  build: .
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
    DJANGO_SECRET_KEY: change-me-in-real-deployments
    DJANGO_ALLOWED_HOSTS: localhost,.localhost,127.0.0.1
    TENANT_BASE_DOMAIN: localhost
    POSTGRES_DB: tenantforge
    POSTGRES_USER: tenantforge
    POSTGRES_PASSWORD: tenantforge
    POSTGRES_HOST: db
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  web:
    <<: *app
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --access-logfile -"
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A config worker --loglevel=info

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tenantforge
      POSTGRES_USER: tenantforge
      POSTGRES_PASSWORD: tenantforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantforge -d tenantforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
